# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
      day: "monday"
    ignore:
      # vite 8 bundles with Rolldown instead of Rollup, which breaks
      # vite-plugin-lit-css's sourcemap generation and fails the
      # vite-plugin-bundlesize build check. Remove once that's fixed upstream.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is the big Golang rewrite, and it's not compatible with some dependencies
      # that rely on the Compiler API (https://github.com/microsoft/TypeScript/wiki/Using-the-Compiler-API)
      # which is not available anymore. Specifically, vite-plugin-dts and @typescript-eslint/*.
      #
      # For now, let's stay on TypeScript 6.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

    groups:
      custom-element:
        patterns:
          - "@custom-elements-manifest/analyzer"
          - "custom-element-*"

      eslint:
        patterns:
          - "@eslint/*"
          - "eslint"
          - "eslint-*"

      playwright:
        patterns:
          - "*playwright*"

      storybook:
        patterns:
          - "*storybook*"

      stylelint:
        patterns:
          - "*stylelint*"

      uswds:
        patterns:
          - "*uswds*"

      vite:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "vitest"
          - "@vitest/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "America/New_York"
      day: "monday"
